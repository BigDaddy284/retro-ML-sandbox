[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-ai-lab"
version = "0.1.0"
description = "An emulator-based machine learning sandbox that lets children train an AI to play retro games."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
retro-ai-lab = "retro_ai_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
qt_api = "pyside6"
markers = [
    "slow: long-running tests that still run in the regression gate",
    "real_emulator: needs a real emulator and ROM; collected only when configured",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["retro_ai_lab"]
