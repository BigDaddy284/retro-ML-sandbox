name: Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows build and launch smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: Build
        run: pyinstaller packaging/retro_ai_lab.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test the built app
        run: python packaging/smoke_test.py dist/RetroAILab/RetroAILab.exe
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RetroAILab-windows
          path: dist/RetroAILab
          retention-days: 14
